<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TheSmartGreen | Cart</title>
    <meta name="description" content="Your shopping cart" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-leaf"></i>
                <span>TheSmartGreen</span>
            </a>
            <button class="menu-toggle" id="menuToggle" type="button" aria-controls="navMenu" aria-expanded="false"
                aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="about.html" class="nav-link">About</a>
                <!-- <a href="cart.html" class="nav-link active">Cart</a> -->
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <div class="cart-box">
        <a href="cart.html">🛒 Cart: <span id="cartCount">0</span></a>
    </div>

    <div id="notification" class="notification"></div>

    <section class="features" style="padding: 80px 0;">
        <div class="container">
            <h2 class="section-title" data-aos="fade-up">Your Cart</h2>
            <div id="cartItems" class="feature-card"
                style="background:#fff; padding:20px; border-radius:12px; box-shadow:var(--shadow-sm);">
                <!-- Cart items will be rendered here -->
            </div>
            <div id="emptyCartMessage" class="empty-cart-container" style="display:none;">
                <div class="empty-cart-icon">🛒</div>
                <h3>Your Cart is Empty</h3>
                <p>Looks like you haven't added anything to your cart yet.</p>
                <p>Browse our eco-friendly products and add your favorites!</p>
                <a href="products.html" class="btn btn-primary" style="margin-top:20px; display:inline-block;">Continue
                    Shopping</a>
            </div>
            <div id="cartSummary" style="margin-top:20px; text-align:right; display:none;">
                <h3>Total: <span id="totalAmount">₹0</span></h3>
                <button class="btn btn-primary" id="checkoutBtn">Checkout with Razorpay</button>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="js/main.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const parsePrice = (priceStr) => {
            const match = priceStr.match(/₹(\d+)/);
            return match ? parseInt(match[1]) : 0;
        };

        const renderCart = () => {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const container = document.getElementById("cartItems");
            const empty = document.getElementById("emptyCartMessage");
            const summary = document.getElementById("cartSummary");
            const totalEl = document.getElementById("totalAmount");
            container.innerHTML = "";

            if (!cart.length) {
                empty.style.display = "block";
                container.style.display = "none";
                summary.style.display = "none";
                return;
            }

            empty.style.display = "none";
            container.style.display = "block";
            summary.style.display = "block";

            let total = 0;
            cart.forEach((item, index) => {
                const itemTotal = parsePrice(item.price) * item.quantity;
                total += itemTotal;
                const itemDiv = document.createElement("div");
                itemDiv.className = "cart-item";
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <strong>${item.name}</strong> - ${item.price} x ${item.quantity} = ₹${itemTotal}
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart('${item.name}')">Remove</button>
                `;
                container.appendChild(itemDiv);
            });
            totalEl.textContent = `₹${total}`;
        };

        const checkout = () => {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (!cart.length) return;

            let total = 0;
            cart.forEach(item => {
                total += parsePrice(item.price) * item.quantity;
            });

            const options = {
                key: 'rzp_test_your_key_here', // Replace with your Razorpay test key
                amount: total * 100, // Amount in paise
                currency: 'INR',
                name: 'TheSmartGreen',
                description: 'Purchase from TheSmartGreen',
                handler: function (response) {
                    alert('Payment successful! Payment ID: ' + response.razorpay_payment_id);
                    localStorage.removeItem("cart");
                    updateCartUI();
                    renderCart();
                },
                prefill: {
                    name: 'Customer Name',
                    email: 'customer@example.com',
                    contact: '9999999999'
                },
                theme: {
                    color: '#0A4A3C'
                }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        };

        document.getElementById("checkoutBtn").addEventListener("click", checkout);

        window.addEventListener("DOMContentLoaded", () => {
            renderCart();
        });

        // Listen for storage changes to update cart display across tabs
        window.addEventListener("storage", (e) => {
            if (e.key === "cart") {
                renderCart();
            }
        });
    </script>
</body>

</html>
